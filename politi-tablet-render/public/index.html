<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>POLITI Tablet</title>
<meta name="theme-color" content="#1d1f25">
<meta name="description" content="POLITI Tablet — politiets registre, flådestyring og opkaldsliste">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
</head>
<body>
<div id="login" class="login-screen">
  <div class="login-card">
    <div class="login-emblem">✦</div>
    <div class="brand">POLITI</div>
    <p class="muted login-subtitle">INTERN POLITIPLATFORM</p>
    <form id="loginForm">
      <label>Brugernavn<input id="username" placeholder="Indtast brugernavn" autocomplete="username" required></label>
      <label>Adgangskode<input id="password" placeholder="Indtast adgangskode" type="password" autocomplete="current-password" required></label>
      <button class="login-submit">Log ind <span>→</span></button>
      <div id="loginError" class="error"></div>
    </form>
    <div class="login-foot">Sikker adgang · POLITI Tablet</div>
  </div>
</div>

<div id="app" class="hidden">
<header>
  <a class="brand" href="#dashboard" aria-label="POLITI hjem">POLITI</a>
  <span class="header-divider"></span>
  <nav id="nav">
    <div class="nav-primary">
      <button data-page="dashboard"><span>⌂</span> Home</button>
      <button data-page="persons"><span>♙</span> Person Register</button>
      <button data-page="vehicles"><span>▣</span> Køretøjs Database</button>
      <button data-page="warrants" data-feature="warrants_enabled"><span>⌕</span> Efterlysninger</button>
      <button data-page="board" data-feature="board_enabled"><span>◈</span> Opslagstavle</button>
      <button data-page="fines"><span>▤</span> Bødetakster</button>
      <button data-page="employees"><span>♟</span> Ansatte</button>
    </div>
    <div class="nav-secondary">
      <button data-page="cases"><span>◫</span> Sager</button>
      <button data-page="fleet"><span>🚔</span> Flådestyring</button>
      <button data-page="calls"><span>☎</span> Opkaldsliste</button>
      <button data-page="applications" data-feature="applications_enabled"><span>▱</span> Ansøgninger</button>
      <button data-page="logs" class="adminOnly"><span>☷</span> Logs</button>
      <button data-page="settings"><span>⚙</span> Indstillinger</button>
    </div>
  </nav>
  <span class="avatar avatar-sm hidden" id="profileInitials" aria-hidden="true"></span>
  <details class="profile-menu"><summary>Min Profil <span>⌄</span></summary><div class="profile-dropdown"><span id="userName"></span><button id="logout" type="button">Log ud</button></div></details>
</header>
<main id="content"></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<footer class="app-footer"><span>POLITI Tablet <i>·</i> Sikkert internt system</span><span>Kun til autoriseret brug</span></footer>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="/app.js"></script>
</body>
</html>
